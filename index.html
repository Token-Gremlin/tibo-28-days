<script id="embedded" type="application/json">{"title": "28 Days of Codex Improvements", "author": "@thsottiaux", "compiled_by": "@TokenGremlin", "timezone": "BRT (UTC-3)", "updated": "2026-10-26 13:05", "total": 28, "announcement": {"date": "2026-10-04 17:33", "url": "https://x.com/i/status/2106845241357824205", "text": "Over the next 28 days, each day we’ll either ship one thing that is a clear improvement and relevant for most codex/work users or ship a full reset. Let the improvements begin."}, "days": [{"day": 1, "date": "2026-10-05 14:20", "ids": ["2107158998495748264"], "category": "speed", "text": "Day 1/\n\nWe have optimized the default speed to be ~50% faster across GPT-6 Astra and GPT-6.1 Sol through the subscription across all our products and partners using Sign in With ChatGPT (including OpenCode, Pi, Amp, Devin, ...).\n\nNo changes needed on your end and this should be felt within the next two hours.", "en": "~50% faster default speed for GPT-6 Astra & GPT-6.1 Sol on subscriptions, incl. Sign in with ChatGPT partners.", "pt": "Velocidade padrão ~50% maior no GPT-6 Astra e GPT-6.1 Sol nas assinaturas, inclusive parceiros (OpenCode, Amp, Devin…).", "url": "https://x.com/i/status/2107158998495748264", "urls": ["https://x.com/i/status/2107158998495748264"], "items": [{"en": "~50% faster default speed for GPT-6 Astra & GPT-6.1 Sol across products and Sign in with ChatGPT partners; felt within 2 hours.", "pt": "Velocidade padrão ~50% maior no GPT-6 Astra e GPT-6.1 Sol em todos os produtos e parceiros; efeito em até 2 horas.", "url": "https://x.com/i/status/2107158998495748264"}, {"en": "Reaching 50 TPS instead of 30 TPS, with a highly optimized tokenizer.", "pt": "50 TPS em vez de 30 TPS, com tokenizer bem otimizado.", "url": "https://x.com/i/status/2107159119107146237"}]}, {"day": 2, "date": "2026-10-06 04:13", "ids": ["2107368734981517634", "2107548725359104441", "2107573405553938664", "2107574912349303197", "2107575657014468879", "2107676072871600470"], "category": "features", "text": "Roundup of Day 2/\n\n2.1/ Approve for me (auto-review) is now included and does not use usage. Can be between 2-10% of plan when used. Also better for you.\n2.2/ Simplified API for builders.\n2.3/ Meeting notes integrated.\n2.4/ Decisions API live for builders. Will use in the app to improve the experience.", "en": "4 ships: free Auto-review, simpler API, meeting notes, Decisions API — plus a full reset after a community vote.", "pt": "4 entregas: Auto-review grátis, API simplificada, notas de reunião, Decisions API — e ainda um reset completo após votação.", "note": "Posted as Day 2.1–2.4 (Oct 6, 04:13–17:53 BRT) plus a roundup; followed by a poll 'Four updates or a reset'.", "url": "https://x.com/i/status/2107368734981517634", "urls": ["https://x.com/i/status/2107368734981517634", "https://x.com/i/status/2107548725359104441", "https://x.com/i/status/2107573405553938664", "https://x.com/i/status/2107574912349303197", "https://x.com/i/status/2107575657014468879", "https://x.com/i/status/2107676072871600470"], "items": [{"en": "2.1 Auto-review ('Approve for me') free for ChatGPT sign-ins, no plan usage.", "pt": "2.1 Auto-review ('Approve for me') grátis pra quem entra com conta ChatGPT, sem gastar uso.", "url": "https://x.com/i/status/2107368734981517634"}, {"en": "Enable via the permissions menu below the composer → 'Approve for me'.", "pt": "Ativa no menu de permissões abaixo do composer → 'Approve for me'.", "url": "https://x.com/i/status/2107504197012988007"}, {"en": "2.2 Less friction when building on the API.", "pt": "2.2 Menos atrito pra construir na API.", "url": "https://x.com/i/status/2107548725359104441"}, {"en": "2.3 Meeting notes integrated: load conversation context into Codex.", "pt": "2.3 Notas de reunião integradas: leva o contexto da conversa pro Codex.", "url": "https://x.com/i/status/2107573405553938664"}, {"en": "2.4 Decisions API live (realtime general classifier).", "pt": "2.4 Decisions API no ar (classificador geral em tempo real).", "url": "https://x.com/i/status/2107574912349303197"}, {"en": "Community vote picked 'reset': full reset processed, improvements kept.", "pt": "A votação escolheu 'reset': reset completo feito, melhorias mantidas.", "url": "https://x.com/i/status/2107676072871600470"}]}, {"day": 3, "date": "2026-10-07 16:19", "ids": ["2107913674593644711", "2108084615349170480", "2107912709715132482", "2107894997538525580", "2107895006350791071"], "category": "features", "text": "Day 3/\n\nThe big one is GPT-6 in Chat, but today is also a little celebration day with a new high of 40M active users across Codex and ChatGPT Work.\n\nLoading a banked reset in everyone's paid accounts. See you again tomorrow!\n\n---\nDay 3 (encore)/\n\nWe silently re-shipped codex cloud. It’s pretty good now", "en": "GPT-6 with Intelligent UI in ChatGPT (powered by GPT-6 Sol on paid tiers) + banked reset for paid accounts + re-shipped Codex Cloud.", "pt": "GPT-6 com Intelligent UI no ChatGPT (GPT-6 Sol nos planos pagos) + reset guardado nas contas pagas + Codex Cloud relançado.", "url": "https://x.com/i/status/2107913674593644711", "urls": ["https://x.com/i/status/2107913674593644711", "https://x.com/i/status/2108084615349170480", "https://x.com/i/status/2107912709715132482", "https://x.com/i/status/2107894997538525580", "https://x.com/i/status/2107895006350791071"], "items": [{"en": "GPT-6 in Chat: new GPT-6 for all ChatGPT users (Tibo, quoting OpenAI).", "pt": "GPT-6 no Chat: novo GPT-6 pra todos no ChatGPT (Tibo citando a OpenAI).", "url": "https://x.com/i/status/2107912709715132482"}, {"en": "Intelligent UI: fast, interactive, more visual answers in ChatGPT.", "pt": "Intelligent UI: respostas rápidas, interativas e mais visuais no ChatGPT.", "url": "https://x.com/OpenAI/status/2107894997538525580"}, {"en": "GPT-6 Sol powers GPT-6 in ChatGPT for Plus/Pro/Business/Enterprise (Luna for Free/Go).", "pt": "GPT-6 Sol roda o GPT-6 no ChatGPT pra Plus/Pro/Business/Enterprise (Luna no Free/Go).", "url": "https://x.com/OpenAI/status/2107895006350791071"}, {"en": "Banked usage reset for all paid accounts; 40M active users.", "pt": "Reset guardado em todas as contas pagas; 40M usuários ativos.", "url": "https://x.com/i/status/2107913674593644711"}, {"en": "Reset confirmed landed across all accounts.", "pt": "Reset confirmado em todas as contas.", "url": "https://x.com/i/status/2108040921044639779"}, {"en": "Encore: Codex Cloud silently re-shipped.", "pt": "Encore: Codex Cloud relançado.", "url": "https://x.com/i/status/2108084615349170480"}, {"en": "Codex Cloud can connect to your tailnet via Tailscale.", "pt": "O Codex Cloud conecta à sua tailnet via Tailscale.", "url": "https://x.com/Tailscale/status/2107836671605551217"}], "note": "Tibo's Day 3 post only says 'The big one is GPT-6 in Chat'. OpenAI calls the feature 'Intelligent UI' (not 'Smart UI'); the GPT-6 Sol detail comes from OpenAI's thread."}, {"day": 4, "date": "2026-10-08 16:15", "ids": ["2108275041276420573"], "category": "speed", "text": "Day 4/\n\nWe have improved steering to be instant, leading to the model now reacting much faster to adjustments you make, allowing you to course-correct direction in realtime and not have the model waste effort.\n\nAlso releasing GPT-6.1 Sol ultrafast. The two work very well together.", "en": "Instant steering (course-correct in realtime) + GPT-6.1 Sol Ultrafast release.", "pt": "Steering instantâneo (corrigir o rumo em tempo real) + lançamento do GPT-6.1 Sol Ultrafast.", "url": "https://x.com/i/status/2108275041276420573", "urls": ["https://x.com/i/status/2108275041276420573"], "items": [{"en": "Instant steering: model reacts to your adjustments in realtime.", "pt": "Steering instantâneo: o modelo reage aos seus ajustes em tempo real.", "url": "https://x.com/i/status/2108275041276420573"}, {"en": "GPT-6.1 Sol Ultrafast in API, Codex & ChatGPT Work — up to 8x faster than Sol Standard.", "pt": "GPT-6.1 Sol Ultrafast na API, Codex e ChatGPT Work — até 8x mais rápido que o Sol Standard.", "url": "https://x.com/OpenAIDevs/status/2108262812489531498"}]}, {"day": 5, "date": "2026-10-09 16:47", "ids": ["2108645667451318747", "2108646052178092403"], "category": "features", "text": "Day 5/\n\nComposer predictions in the desktop app. Often leads to a double take with how on point they are. Included in the Pro plans without consuming usage.\n\n---\nDay 5 (dots edition)/\n\nYou can now create and text your dot entirely from the ChatGPT mobile app. Impressed so many created them via the desktop/web app previously. Time to scale!", "en": "Composer predictions in the desktop app (Pro, no usage) + create/text your dot from the mobile app.", "pt": "Previsões no composer do app desktop (Pro, sem gastar uso) + criar e conversar com seu dot no app mobile.", "url": "https://x.com/i/status/2108645667451318747", "urls": ["https://x.com/i/status/2108645667451318747", "https://x.com/i/status/2108646052178092403"], "items": [{"en": "Composer predictions in the desktop app, included in Pro without usage.", "pt": "Previsões no composer do app desktop, no Pro sem gastar uso.", "url": "https://x.com/i/status/2108645667451318747"}, {"en": "Beta for Pro: Codex suggests your next message from the conversation.", "pt": "Beta no Pro: o Codex sugere sua próxima mensagem com base na conversa.", "url": "https://x.com/OpenAIDevs/status/2108624138369929725"}, {"en": "Dots edition: create and text your dot from the ChatGPT mobile app.", "pt": "Edição dots: crie e converse com seu dot no app mobile do ChatGPT.", "url": "https://x.com/i/status/2108646052178092403"}, {"en": "Dots creation now on ChatGPT for iOS and Android.", "pt": "Criação de dots agora no ChatGPT pra iOS e Android.", "url": "https://x.com/ChatGPT/status/2108636745915052037"}]}, {"day": 6, "date": "2026-10-10 19:15", "ids": ["2109045220411351517"], "category": "reset", "text": "Day 6/ Reset", "en": "Full usage reset.", "pt": "Reset completo de uso.", "url": "https://x.com/i/status/2109045220411351517", "urls": ["https://x.com/i/status/2109045220411351517"], "items": [{"en": "Day 6: Reset.", "pt": "Day 6: Reset.", "url": "https://x.com/i/status/2109045220411351517"}, {"en": "Global reset by EOD.", "pt": "Reset global até o fim do dia.", "url": "https://x.com/i/status/2109045392684032299"}]}, {"day": 7, "date": "2026-10-11 20:45", "ids": ["2109430343346581527"], "category": "features", "text": "Day 7/\n\nWe have increased default context length for GPT-6.1 Sol to 500k when used through Codex & Work, up from 272k or an ~ 80% increase.\n\nWe will go higher in the future, but it helps reduce occurrence of compactions and with tasks that require keeping a lot of context and nuance over periods of time. It was carefully tested and is the new sweet spot for most of our users. You can still override it if you want to be higher our lower, with maximum context length of GPT-6.1 Sol of 1M.", "en": "Default context for GPT-6.1 Sol in Codex & Work raised 272k → 500k (max 1M).", "pt": "Contexto padrão do GPT-6.1 Sol no Codex e Work subiu de 272k pra 500k (máx. 1M).", "url": "https://x.com/i/status/2109430343346581527", "urls": ["https://x.com/i/status/2109430343346581527"], "items": [{"en": "Default context for GPT-6.1 Sol in Codex & Work: 272k → 500k (overridable, max 1M).", "pt": "Contexto padrão do GPT-6.1 Sol no Codex e Work: 272k → 500k (ajustável, máx. 1M).", "url": "https://x.com/i/status/2109430343346581527"}, {"en": "No long-context fees for GPT-6.1 Sol when using the subscription.", "pt": "Sem taxa de contexto longo no GPT-6.1 Sol usando a assinatura.", "url": "https://x.com/i/status/2109430894604026039"}]}, {"day": 8, "date": "2026-10-12 22:03", "ids": ["2109812216212099456"], "category": "reset", "text": "Day 8/ Reset", "en": "Full usage reset.", "pt": "Reset completo de uso.", "url": "https://x.com/i/status/2109812216212099456", "urls": ["https://x.com/i/status/2109812216212099456"], "items": [{"en": "Day 8: Reset.", "pt": "Day 8: Reset.", "url": "https://x.com/i/status/2109812216212099456"}, {"en": "Global reset landing by EOD PST.", "pt": "Reset global até o fim do dia (PST).", "url": "https://x.com/i/status/2109812360596865224"}, {"en": "Confirmed: reset done.", "pt": "Confirmado: reset concluído.", "url": "https://x.com/i/status/2109873287853707513"}]}, {"day": 9, "date": "2026-10-13 20:32", "ids": ["2110151780478927344"], "category": "reliability", "text": "Day 9/\n\nWe've rolled out optimizations to how we store state on disk for the chatgpt & codex desktop app that should reduce the amount stored on disk by 60%. Small ship but we've heard enough feedback about power users running out of disk space.", "en": "Desktop app (ChatGPT & Codex) stores ~60% less state on disk.", "pt": "App desktop (ChatGPT e Codex) passa a ocupar ~60% menos espaço em disco.", "note": "Same text was first posted 20s earlier mislabeled 'Day 8/' (2110151690641154499).", "url": "https://x.com/i/status/2110151780478927344", "urls": ["https://x.com/i/status/2110151780478927344"], "items": [{"en": "Desktop app (ChatGPT & Codex) stores ~60% less state on disk.", "pt": "App desktop (ChatGPT e Codex) usa ~60% menos disco.", "url": "https://x.com/i/status/2110151780478927344"}]}, {"day": 10, "date": "2026-10-15 01:55", "ids": ["2110595484180214059"], "category": "reset", "text": "The reports of my reset button being lost are greatly exaggerated\n\nDay 10/ Reset", "en": "Full usage reset.", "pt": "Reset completo de uso.", "url": "https://x.com/i/status/2110595484180214059", "urls": ["https://x.com/i/status/2110595484180214059"], "items": [{"en": "Day 10: Reset.", "pt": "Day 10: Reset.", "url": "https://x.com/i/status/2110595484180214059"}, {"en": "Landing within the next 2 hours.", "pt": "Chega nas próximas 2 horas.", "url": "https://x.com/i/status/2110595554036400151"}]}, {"day": 11, "date": "2026-10-15 12:11", "ids": ["2110750421367287996"], "category": "capacity/limits", "text": "Day 11/\n\nWe've landed a series of changes and more compute to very significantly decrease the occurrence of the disruptive \"Selected model is at capacity. Please try a different model\". When it does happen, it should also eventually just continue by itself and not just block on it.\n\nLet us know if you still see it out there in the wild and we'll take a look.", "en": "More compute + fixes to sharply cut 'model is at capacity' errors; tasks now auto-continue.", "pt": "Mais compute e ajustes pra reduzir muito o erro “model is at capacity”; agora a tarefa continua sozinha.", "url": "https://x.com/i/status/2110750421367287996", "urls": ["https://x.com/i/status/2110750421367287996"], "items": [{"en": "More compute + changes to sharply reduce 'Selected model is at capacity' errors.", "pt": "Mais compute e ajustes pra reduzir muito o erro 'Selected model is at capacity'.", "url": "https://x.com/i/status/2110750421367287996"}, {"en": "When it happens, the task auto-continues instead of blocking.", "pt": "Quando acontecer, a tarefa continua sozinha em vez de travar.", "url": "https://x.com/i/status/2110750421367287996"}]}, {"day": 12, "date": "2026-10-16 20:55", "ids": ["2111244596131111253"], "category": "capacity/limits", "text": "Day 12/\n\nWe’ve made improvements to Codex & Work that increase the effective usage you get. We achieved this by reusing context across subagents, keeping context cached longer, and improved request routing that allows us to increase cache hits.", "en": "Codex & Work now give more effective usage: shared subagent context, longer caching, smarter routing for cache hits.", "pt": "Codex e Work agora rendem mais uso efetivo: contexto reaproveitado entre subagentes, cache mais longo e roteamento melhor pra mais cache hits.", "url": "https://x.com/i/status/2111244596131111253", "urls": ["https://x.com/i/status/2111244596131111253"], "items": [{"en": "Improvements to Codex & Work increase effective usage.", "pt": "Melhorias no Codex e no Work aumentam o uso efetivo.", "url": "https://x.com/i/status/2111244 <script>
const C={"speed":"#3ddc97","features":"#7c9cff","capacity/limits":"#ffb547","reliability":"#4cc9f0","reset":"#c38bff","pricing":"#ff6b8a"};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(d){
 const days=d.days.sort((a,b)=>a.day-b.day),done=Math.max(0,...days.map(x=>x.day));
 sub.innerHTML=`Daily ships from <a href="https://x.com/thsottiaux">${d.author}</a> (OpenAI · Codex): one clear improvement or a full usage reset, every day for 28 days.`;
 ann.innerHTML=`📣 ${esc(d.announcement.text)} — <a href="${d.announcement.url}" target="_blank">announcement</a>`;
 bar.style.width=(done/d.total*100)+"%";pn.textContent=`Day ${done}/${d.total}`;
 const cnt={};days.forEach(x=>cnt[x.category]=(cnt[x.category]||0)+1);
 legend.innerHTML=Object.entries(cnt).map(([k,v])=>`<span class="chip" style="color:${C[k]||'#ccc'}">● ${k} · ${v}</span>`).join("");
 const by={};days.forEach(x=>by[x.day]=x);let h="";
 for(let i=1;i<=d.total;i++){const x=by[i];
  if(!x){h+=`<div class="card ph">${i<=done?'Day '+i+' · not found':'Day '+i+' · upcoming'}</div>`;continue}
  const c=C[x.category]||"#ccc";
  h+=`<div class="card ${x.category=='reset'?'reset':''}"><div class="n"><a href="${x.url}" target="_blank" style="color:inherit;text-decoration:none"><b>Day ${x.day} ↗</b></a><span>${x.date.slice(5,10).replace('-','/')}</span></div><p>${esc(x.en)}</p>${(x.items||[]).length?`<ul style="margin:0 0 10px;padding-left:18px;font-size:13px;color:#aeb7c6">${x.items.map(i=>`<li><a href="${i.url}" target="_blank" style="color:inherit">${esc(i.en)}</a></li>`).join("")}</ul>`:""}<span class="tag" style="color:${c};border:1px solid ${c}55">${x.category}</span></div>`}
 grid.innerHTML=h;upd.textContent=`Updated ${d.updated} ${d.timezone}`;
}
fetch("data.json",{cache:"no-store"}).then(r=>r.json()).then(render).catch(()=>render(JSON.parse(embedded.textContent)));
</script></body></html>
